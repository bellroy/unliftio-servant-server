name: Renovate
on:
  schedule:
    - cron: 02 0-9/1 * * *
  issues:
    types:
      - edited
      - reopened
  push:
    branches:
      - master
    paths:
      - .github/renovate.json
      - renovate.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  renovate:
    name: Renovate
    if: ${{ github.actor != 'bellroy-renovate-bot[bot]' }}
    runs-on: ubuntu-slim
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          token: ${{ github.token }}
          docker-network: host
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_DEPENDENCY_DASHBOARD: true
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || 'info' }}
